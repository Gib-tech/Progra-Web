<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lector | READING STORM</title>

    <link
        rel="stylesheet"
        href="css/leergrapa.css"
    >
</head>

<body>

    <!-- =========================================
         BARRA SUPERIOR
    ========================================== -->

    <header class="reader-header">

        <div class="header-left">

            <button
                type="button"
                class="btn-back"
                id="btn-back"
                title="Volver a la biblioteca"
            >
                ←
            </button>

            <div class="brand">
                <span>READING</span>
                <strong>STORM</strong>
            </div>

        </div>


        <div class="comic-header-info">

            <span
                class="comic-collection"
                id="comic-collection"
            >
                COLECCIÓN
            </span>

            <h1 id="comic-title">
                Cargando grapa...
            </h1>

        </div>


        <div class="header-right">

            <span
                class="header-page"
                id="header-page"
            >
                Página 0 de 0
            </span>

            <button
                type="button"
                class="btn-menu"
                id="btn-menu"
                title="Opciones"
            >
                ⋮
            </button>

        </div>

    </header>


    <!-- =========================================
         MENÚ DE OPCIONES
    ========================================== -->

    <div
        class="reader-menu"
        id="reader-menu"
    >

        <button
            type="button"
            id="menu-biblioteca"
        >
            <span>←</span>

            Volver a biblioteca
        </button>

        <button
            type="button"
            id="menu-inicio"
        >
            <span>↟</span>

            Primera página
        </button>

        <button
            type="button"
            id="menu-final"
        >
            <span>↡</span>

            Última página
        </button>

    </div>


    <!-- =========================================
         LECTOR
    ========================================== -->

    <main
        class="reader-container"
        id="reader-container"
    >

        <!-- =====================================
             MODO PÁGINA
        ====================================== -->

        <section
            class="page-reader"
            id="page-reader"
        >

            <button
                type="button"
                class="navigation-button previous"
                id="btn-previous"
                title="Página anterior"
            >
                ‹
            </button>


            <div class="comic-page-container">

                <div
                    class="page-loading"
                    id="page-loading"
                >
                    <div class="loading-spinner"></div>

                    <span>
                        Cargando página...
                    </span>
                </div>


                <img
                    id="comic-page"
                    class="comic-page"
                    src=""
                    alt="Página del cómic"
                    draggable="false"
                >

            </div>


            <button
                type="button"
                class="navigation-button next"
                id="btn-next"
                title="Página siguiente"
            >
                ›
            </button>

        </section>


        <!-- =====================================
             MODO VERTICAL
        ====================================== -->

        <section
            class="vertical-reader"
            id="vertical-reader"
        >

            <!-- Las imágenes se generan
                 mediante JavaScript -->

        </section>

    </main>


    <!-- =========================================
         CONTROLES INFERIORES
    ========================================== -->

    <footer
        class="reader-controls"
        id="reader-controls"
    >

        <!-- PROGRESO -->

        <div class="progress-section">

            <span
                class="progress-page"
                id="progress-current"
            >
                1
            </span>


            <input
                type="range"
                id="progress-slider"
                min="1"
                max="1"
                value="1"
                step="1"
                aria-label="Página actual"
            >


            <span
                class="progress-page"
                id="progress-total"
            >
                1
            </span>

        </div>


        <!-- BOTONES -->

        <div class="control-actions">

            <button
                type="button"
                class="control-button"
                id="control-previous"
            >
                ← Anterior
            </button>


            <div class="reading-mode">

                <span>
                    Modo
                </span>

                <select id="reading-mode">

                    <option value="page">
                        Página
                    </option>

                    <option value="vertical">
                        Vertical
                    </option>

                </select>

            </div>


            <div class="page-counter">

                <strong id="bottom-current">
                    1
                </strong>

                <span>/</span>

                <span id="bottom-total">
                    1
                </span>

            </div>


            <button
                type="button"
                class="control-button primary"
                id="control-next"
            >
                Siguiente →
            </button>

        </div>

    </footer>


    <!-- =========================================
         MENSAJE SIN GRAPA
    ========================================== -->

    <div
        class="empty-overlay"
        id="empty-overlay"
    >

        <div class="empty-box">

            <div class="empty-icon">
                !
            </div>

            <h2>
                No encontramos esta grapa
            </h2>

            <p>
                Es posible que haya sido eliminada o que todavía
                no exista ninguna grapa en tu biblioteca.
            </p>

            <button
                type="button"
                id="empty-back"
            >
                Volver a la biblioteca
            </button>

        </div>

    </div>


    <script src="js/leergrapa.js"></script>

</body>

</html>
